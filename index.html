<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="compro-site" content="1"><meta name="description" content="Shop Comprô: a loja onde você compra à vontade e nada é cobrado."><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Shop Comprô</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: marketplace em coluna única. Faixa de aviso + cabeçalho fixos no topo, feed em grade, navegação inferior no celular, folhas deslizantes para produto. */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#F6F9F8; --fg:#14201D; --muted:#5A6B67; --line:#DCE5E2;
  --brand:#0B7A6B; --brand-ink:#FFFFFF; --brand-soft:#D7EFEA;
  --hot:#C92C63; --hot-soft:#FBE3EC; --sun:#FFC83D; --sun-ink:#3A2A00;
  --warn-bg:#14201D; --warn-fg:#FFE79A;
  --shadow:0 1px 2px rgba(20,32,29,.06),0 6px 18px rgba(20,32,29,.06);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201E; --surface-2:#1C2826; --fg:#E7EFEC; --muted:#9AABA6; --line:#283632;
  --brand:#2DB7A2; --brand-ink:#062420; --brand-soft:#173B35;
  --hot:#FF6A98; --hot-soft:#3A1A26; --sun:#FFC83D; --sun-ink:#3A2A00;
  --warn-bg:#FFE79A; --warn-fg:#2A1E00;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201E; --surface-2:#1C2826; --fg:#E7EFEC; --muted:#9AABA6; --line:#283632;
  --brand:#2DB7A2; --brand-ink:#062420; --brand-soft:#173B35;
  --hot:#FF6A98; --hot-soft:#3A1A26; --sun:#FFC83D; --sun-ink:#3A2A00;
  --warn-bg:#FFE79A; --warn-fg:#2A1E00;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--warn-bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* topo fixo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.demo{background:var(--warn-bg);color:var(--warn-fg);font-size:12.5px;font-weight:600;letter-spacing:.01em}
.demo .wrap{display:flex;gap:8px;align-items:center;justify-content:center;padding-block:7px;text-align:center}
.demo b{background:var(--sun);color:var(--sun-ink);border-radius:4px;padding:1px 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.head{background:var(--brand);color:var(--brand-ink)}
.head .wrap{display:flex;gap:14px;align-items:center;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;color:inherit;flex:none}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--sun);display:grid;place-items:center}
.logo-mark svg{width:22px;height:22px}
.logo span{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.search{flex:1;min-width:0;display:flex;background:var(--surface);border-radius:12px;overflow:hidden;border:2px solid transparent}
.search:focus-within{border-color:var(--sun)}
.search input{flex:1;min-width:0;border:0;background:none;padding:10px 12px;font:inherit;color:var(--fg);outline:none}
.search button{border:0;background:var(--sun);color:var(--sun-ink);padding:0 14px;font-weight:700}
.hbtn{position:relative;border:0;background:rgba(255,255,255,.14);color:inherit;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.hbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:var(--hot);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--brand)}
.badge[data-zero]{display:none}
.hello{font-size:13px;opacity:.9;white-space:nowrap}
.desk-only{display:none}
@media (min-width:760px){.desk-only{display:inline-flex}.hello.desk-only{display:block}body{padding-bottom:24px}}
@media (max-width:440px){.logo span{font-size:15px;line-height:1.05;max-width:4.6em;white-space:normal}.head .wrap{gap:10px}.demo{font-size:11.5px}}

/* chips de categoria */
.cats{background:var(--surface);border-bottom:1px solid var(--line)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

main{padding-block:16px 8px}
section{margin-bottom:22px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.link{border:0;background:none;color:var(--brand);font-weight:700;font-size:13.5px;padding:0}
.hot-h{color:var(--fg)!important}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.catgrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.cattile{border:0;padding:0;border-radius:14px;overflow:hidden;position:relative;background:var(--surface);box-shadow:var(--shadow);text-align:left}
.cattile .ct{position:absolute;inset:auto 0 0 0;z-index:2;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;display:flex;flex-direction:column}
.cattile b{font-size:15px}.cattile small{font-size:12px;opacity:.85}
.upd{margin:-4px 0 10px;color:var(--muted);font-size:12px}
.adban{grid-column:1/-1;border:0;padding:0 38% 0 0;border-radius:16px;overflow:hidden;display:block;position:relative;text-align:left;min-height:150px;box-shadow:var(--shadow);margin-block:4px}
.adban img{position:absolute;top:0;right:0;width:38%;height:100%;object-fit:cover;display:block}
.adtxt{padding:16px;min-height:150px;display:flex;flex-direction:column;gap:4px;justify-content:center;min-width:0}
.adtxt b{font-family:var(--f-display);font-size:21px;line-height:1.1;text-wrap:balance}
.adtxt span{font-size:13px;opacity:.9}
.adtxt em{font-style:normal;font-weight:700;font-size:13px;margin-top:4px}
.adtag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.75}
.adwide{width:100%;margin-bottom:22px}
.a1{background:#3B2416;color:#F7E7D4}.a2{background:#1E2A4A;color:#E3E9FF}.a3{background:#DDEFD9;color:#1F3A1C}
.a4{background:#9DE3D8;color:#0B3B34}.a5{background:#FFE3A3;color:#3A2A00}.a6{background:#F4D4DE;color:#4A1426}
@media (min-width:900px){.adban{padding-right:30%;min-height:170px}.adban img{width:30%}.adtxt{padding:22px 28px}.adtxt b{font-size:26px}}
.bf{background:#0E0E10;color:#F5F5F5;border-radius:18px;padding:16px;margin-bottom:22px;display:grid;gap:12px;box-shadow:var(--shadow)}
.bf-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.bf-k{color:var(--sun);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px}
.bf h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:2px 0 4px;max-width:20ch;text-wrap:balance;color:#fff}
.bf p{margin:0;font-size:13px;color:#C9C9CF}
.bf-clock{display:flex;gap:6px}
.bf-clock span{background:#222226;border:1px solid #34343A;border-radius:10px;min-width:52px;padding:6px 6px 5px;text-align:center;font-size:10.5px;color:#B8B8C0;text-transform:uppercase;letter-spacing:.05em}
.bf-clock b{display:block;font-family:var(--f-display);font-size:22px;color:var(--sun);letter-spacing:0}
.bf .mini .pr{color:#FF7AA5}.bf .mini .pr s{color:#9A9AA3;font-size:11px;font-weight:400}
.bfnm{color:#EDEDED;margin-top:6px;font-size:12.5px}
.bfoff{background:#FF2E63!important;color:#fff!important}
.tagx.bftag{background:#0E0E10;color:var(--sun)}
.bf-cta{background:var(--sun);color:var(--sun-ink);justify-self:start}
.sec-h small{color:var(--muted);font-size:13px}

/* banners */
.banners{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;border-radius:16px;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
@media (min-width:900px){.banners{grid-auto-columns:calc((100% - 24px)/3)}}
.ban{scroll-snap-align:start;border-radius:16px;padding:18px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.ban h3{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.1;margin:0 0 4px;max-width:15ch;text-wrap:balance}
.ban p{margin:0;font-size:13px;max-width:28ch}
.ban .big{position:absolute;right:10px;bottom:-6px;font-size:72px;line-height:1;opacity:.9}
.ban-1{background:var(--sun);color:var(--sun-ink)}
.ban-2{background:var(--hot);color:#fff}
.ban-3{background:var(--brand-soft);color:var(--fg)}

/* oferta relâmpago */
.flash{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.flash .sec-h h2{white-space:nowrap;color:var(--hot);display:flex;align-items:center;gap:8px}
.clock{display:inline-flex;gap:3px;font-weight:700;font-size:13px}
.clock span{background:var(--fg);color:var(--bg);border-radius:5px;padding:2px 6px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:132px;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mini{border:0;background:none;padding:0;text-align:left}
.mini .ph{border-radius:12px}
.mini .pr{color:var(--hot);font-weight:800;margin-top:6px}
.bar{height:16px;border-radius:8px;background:var(--hot-soft);position:relative;overflow:hidden;margin-top:4px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--hot);border-radius:8px}
.bar em{position:relative;display:block;text-align:center;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;line-height:16px;mix-blend-mode:normal;text-shadow:0 0 3px rgba(0,0,0,.35)}

/* grade de produtos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}}
.card{border:0;background:var(--surface);border-radius:14px;padding:0;text-align:left;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.ph{aspect-ratio:1/1;max-width:100%;position:relative;display:grid;place-items:center;background:linear-gradient(145deg,hsl(var(--h) 75% 88%),hsl(calc(var(--h) + 30) 70% 78%))}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off,.tagx{z-index:1}
.ph span{font-size:clamp(44px,12vw,64px);line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
.off{position:absolute;top:8px;right:8px;background:var(--sun);color:var(--sun-ink);font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 6px}
.tagx{position:absolute;top:8px;left:8px;background:var(--hot);color:#fff;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;text-transform:uppercase;letter-spacing:.04em}
.ci{padding:9px 10px 11px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{margin:0;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pr{color:var(--hot);font-weight:800;font-size:16px}
.pr s{color:var(--muted);font-weight:400;font-size:12px;margin-left:4px}
.meta{color:var(--muted);font-size:12px;display:flex;gap:6px;align-items:center;margin-top:auto}
.meta .st{color:#E0A100}
.free{font-size:11px;font-weight:700;color:var(--brand);border:1px solid currentColor;border-radius:4px;padding:0 4px;align-self:flex-start}
.empty{background:var(--surface);border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:20px;margin-bottom:6px}

/* botões */
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn-main{background:var(--hot);color:#fff}
.btn-alt{background:var(--brand-soft);color:var(--brand)}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* folha de produto */
.scrim{position:fixed;inset:0;background:rgba(5,12,10,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:760px){.scrim{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .ph{aspect-ratio:16/11}
.sheet .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off,.tagx{z-index:1}
.ph span{font-size:110px}
.sheet-x{position:absolute;top:12px;right:12px;border:0;width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--fg);font-size:20px;box-shadow:var(--shadow)}
.sb{padding:14px 16px;display:flex;flex-direction:column;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sb h3{margin:0;font-size:18px;line-height:1.3;font-weight:600}
.sb .pr{font-size:26px}
.sb .pr s{font-size:14px}
.opt-l{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 12px;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--hot);color:var(--hot);background:var(--hot-soft);font-weight:600}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{border:0;background:var(--surface-2);width:38px;height:36px;font-size:18px}
.qty output{min-width:40px;text-align:center;font-weight:700}
.was{color:var(--muted);font-size:11.5px;line-height:1;margin-top:2px}
.inst{font-size:11.5px;color:var(--brand);font-weight:600}
.sb .inst{font-size:13px;margin-top:2px}
.opt.sw{display:inline-flex;align-items:center;gap:6px}
.opt.sw i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none}
.opt small{font-size:11px;color:var(--muted);margin-left:4px;font-weight:500}
.opt-l b{color:var(--fg)}
.seller{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.seller b{display:block;font-size:14px}.seller small{color:var(--muted);font-size:12px}
.slogo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;background:hsl(var(--h) 45% 38%);flex:none}
.seller .ok{margin-left:auto;font-size:11px;font-weight:700;color:var(--brand);border:1px solid currentColor;border-radius:999px;padding:2px 8px;white-space:nowrap}
.ship{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--fg)}.ship small{color:var(--muted)}
.spec{width:100%;border-collapse:collapse;font-size:13px}.spec th,.spec td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}.spec th{width:40%;color:var(--muted);font-weight:500;background:var(--surface-2)}
.rev{border-top:1px solid var(--line);padding:8px 0;font-size:13px}.rev .st{color:#E0A100;font-size:12px}.rev p{margin:3px 0 0;color:var(--muted)}
.sheet-x{z-index:6}.gal{position:relative}.gtrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gtrack::-webkit-scrollbar{display:none}
.gs{flex:0 0 100%;scroll-snap-align:start;overflow:hidden}
.glbl{position:absolute;left:10px;bottom:10px;z-index:1;background:rgba(0,0,0,.55);color:#fff;font-style:normal;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px}
.gcount{position:absolute;right:12px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;z-index:2}
.gthumbs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
.gth{flex:none;width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--surface-2)}
.gth[aria-pressed="true"]{border-color:var(--hot)}.gth img{width:100%;height:100%;object-fit:cover;display:block}
.more{display:flex;justify-content:center;margin:18px 0 6px}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note svg{flex:none;width:18px;height:18px;color:var(--brand);margin-top:1px}

/* carrinho e checkout */
.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px}
.two{display:grid;gap:16px}
@media (min-width:900px){.two{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.line{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .ph{border-radius:10px}
.line .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.off,.tagx{z-index:1}
.ph span{font-size:34px}
.line h4{margin:0 0 2px;font-size:14px;font-weight:600;line-height:1.3}
.line .v{font-size:12.5px;color:var(--muted)}
.line .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.rm{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline}
.sum{display:flex;flex-direction:column;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:10px}
.sum .tot span:last-child{color:var(--hot)}
.green{color:var(--brand);font-weight:600}
.back{border:0;background:none;color:var(--brand);font-weight:700;padding:0;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
.addr{display:flex;gap:10px;align-items:flex-start}
.addr svg{flex:none;width:20px;height:20px;color:var(--hot);margin-top:2px}
.addr p{margin:0;font-size:14px}
.addr small{color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted)}
